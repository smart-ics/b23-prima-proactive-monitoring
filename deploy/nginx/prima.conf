# ==============================================================================
# PrIMA Proactive Invariant Monitoring Assistant
# Nginx Reverse Proxy & TLS Termination Configuration
# Realizes DEC-008 & DEC-009 for Hospital On-Premise Production Deployment
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Upstream Definitions
# ------------------------------------------------------------------------------
upstream prima_backend {
    # Points to PrIMA.Api Kestrel service (local port 5000 or docker container name)
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. HTTP -> HTTPS Redirection (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name prima.hospital.internal;

    # Allow Let's Encrypt / ACME challenge if hospital uses automated certs
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 3. Production HTTPS Server Block (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prima.hospital.internal;

    # --------------------------------------------------------------------------
    # TLS / SSL Certificates & Modern Ciphers
    # Place hospital enterprise CA certificates or commercial certs here:
    # --------------------------------------------------------------------------
    ssl_certificate         /etc/ssl/certs/prima.crt;
    ssl_certificate_key     /etc/ssl/private/prima.key;
    ssl_session_timeout     1d;
    ssl_session_cache       shared:PrIMASSL:10m;
    ssl_session_tickets     off;

    # Modern TLS protocols only (reject SSLv3, TLS 1.0, TLS 1.1)
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # --------------------------------------------------------------------------
    # Production Hardened Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;

    # --------------------------------------------------------------------------
    # Gzip Compression for Fast SPA Delivery
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # Frontend SPA Root (Vue 3 / Vite Distribution)
    # --------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Static assets long-term cache (Vite hashes assets in /assets/)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # SPA Client-Side Routing Fallback (All unknown paths return index.html)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy to PrIMA.Api Minimal APIs (/api/* and /health)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://prima_backend;
        proxy_http_version 1.1;

        # WebSocket and Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Forwarded Headers for Kestrel
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for real-time telemetry streaming
        proxy_buffering off;
    }

    # Deep SQL Health Probe Endpoint Pass-Through
    location = /health {
        proxy_pass http://prima_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
